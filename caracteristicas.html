<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>InspectAR - Características</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
color:white;
}

.header{
background:#111827;
padding:20px;
}

.btn{
background:#2563eb;
color:white;
padding:12px 18px;
border-radius:8px;
text-decoration:none;
font-weight:bold;
}

.container{
max-width:1200px;
margin:auto;
padding:20px;
}

.card{
background:#1f2937;
padding:20px;
border-radius:12px;
margin-bottom:20px;
}

label{
display:block;
margin-top:15px;
margin-bottom:6px;
}

input,
select,
textarea{
width:100%;
padding:12px;
border:none;
border-radius:8px;
}

textarea{
height:100px;
resize:vertical;
}

.salvar{
margin-top:20px;
background:#16a34a;
color:white;
border:none;
padding:12px 20px;
border-radius:8px;
cursor:pointer;
font-weight:bold;
font-size:16px;
}

.item{
background:#374151;
padding:15px;
border-radius:8px;
margin-bottom:12px;
}

.excluir{
margin-top:12px;
background:#dc2626;
color:white;
border:none;
padding:10px 14px;
border-radius:8px;
cursor:pointer;
}

.info{
margin-bottom:15px;
color:#cbd5e1;
font-weight:bold;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

</style>

</head>

<body>

<div class="header">

<a href="/" class="btn">
← Dashboard
</a>

</div>

<div class="container">

<div class="card">

<h2>Nova Característica</h2>

<label>PN</label>

<input
id="pn"
placeholder="86699800">

<label>Característica</label>

<input
id="caracteristica"
placeholder="Furo Principal">

<label>Tipo</label>

<select id="tipo">

<option>FURO</option>

<option>COMPONENTE</option>

<option>DIMENSAO</option>

<option>MONTAGEM</option>

</select>

<div class="grid">

<div>

<label>Posição X</label>

<input
id="posx"
type="number"
value="0">

</div>

<div>

<label>Posição Y</label>

<input
id="posy"
type="number"
value="0">

</div>

</div>

<label>Tolerância (mm)</label>

<input
id="tolerancia"
type="number"
step="0.01"
value="0.20">

<label>Critério de Inspeção</label>

<textarea
id="criterio"
placeholder="Ex.: Verificar alinhamento do furo principal."></textarea>

<button
class="salvar"
onclick="salvarCaracteristica()">

Salvar Característica

</button>

</div>

<div class="card">

<h2>Características Cadastradas</h2>

<div
id="total"
class="info">
</div>

<div id="lista">
</div>

</div>

</div>

<script>

function carregarCaracteristicas(){

const caracteristicas =
JSON.parse(
localStorage.getItem("caracteristicas")
|| "[]"
);

document.getElementById("total")
.innerHTML =
"Total de características: " +
caracteristicas.length;

const lista =
document.getElementById("lista");

lista.innerHTML = "";

caracteristicas.forEach(function(item,index){

lista.innerHTML += `

<div class="item">

<b>PN:</b> ${item.pn}

<br><br>

<b>Característica:</b>
${item.caracteristica}

<br><br>

<b>Tipo:</b>
${item.tipo}

<br><br>

<b>Posição X:</b>
${item.posx}

<br>

<b>Posição Y:</b>
${item.posy}

<br><br>

<b>Tolerância:</b>
±${item.tolerancia} mm

<br><br>

<b>Critério:</b>

<br>

${item.criterio}

<br>

<button
class="excluir"
onclick="excluirCaracteristica(${index})">

🗑 Excluir

</button>

</div>

`;

});

}

function salvarCaracteristica(){

const pn =
document.getElementById("pn")
.value.trim();

const caracteristica =
document.getElementById("caracteristica")
.value.trim();

const tipo =
document.getElementById("tipo")
.value;

const posx =
document.getElementById("posx")
.value;

const posy =
document.getElementById("posy")
.value;

const tolerancia =
document.getElementById("tolerancia")
.value;

const criterio =
document.getElementById("criterio")
.value.trim();

if(!pn || !caracteristica){

alert(
"Preencha PN e Característica."
);

return;

}

const caracteristicas =
JSON.parse(
localStorage.getItem("caracteristicas")
|| "[]"
);

caracteristicas.push({

pn,
caracteristica,
tipo,
posx,
posy,
tolerancia,
criterio

});

localStorage.setItem(
"caracteristicas",
JSON.stringify(caracteristicas)
);

document.getElementById("pn").value = "";
document.getElementById("caracteristica").value = "";
document.getElementById("criterio").value = "";

carregarCaracteristicas();

alert(
"Característica cadastrada com sucesso."
);

}

function excluirCaracteristica(index){

if(
!confirm(
"Deseja excluir esta característica?"
)
){
return;
}

const caracteristicas =
JSON.parse(
localStorage.getItem("caracteristicas")
|| "[]"
);

caracteristicas.splice(index,1);

localStorage.setItem(
"caracteristicas",
JSON.stringify(caracteristicas)
);

carregarCaracteristicas();

}

carregarCaracteristicas();

</script>

</body>

</html>
