<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<title>InspectAR AR</title>

<script type="module"
src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
</script>

<style>

body{
margin:0;
background:#0f172a;
color:white;
font-family:Arial;
}

.info{
padding:20px;
background:#111827;
}

model-viewer{
width:100%;
height:500px;
background:#374151;
}

.item{
background:#1f2937;
padding:10px;
margin:10px;
border-radius:8px;
}

</style>

</head>

<body>

<div class="info">

<h2>
PN:
<span id="pnAtual">
Carregando...
</span>
</h2>

</div>

<model-viewer
id="modelo"
camera-controls
auto-rotate>
</model-viewer>

<div
id="caracteristicas">
</div>

<script>

const pn =
sessionStorage.getItem(
"pnSelecionado"
);

const modelo =
sessionStorage.getItem(
"modeloSelecionado"
);

document.getElementById(
"pnAtual"
).innerText =
pn || "Não encontrado";

if(modelo){

document.getElementById(
"modelo"
).src =
modelo;

}

const caracteristicas =
JSON.parse(
localStorage.getItem(
"caracteristicas"
) || "[]"
);

const area =
document.getElementById(
"caracteristicas"
);

caracteristicas
.filter(c => c.pn === pn)
.forEach(c => {

area.innerHTML += `
<div class="item">

${c.caracteristica}
<br>
${c.tipo}

</div>
`;

});

</script>

</body>

</html>
