<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>InspectAR AR</title>

<script type="module"
src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
</script>

<style>

body{
margin:0;
background:#0b1736;
overflow:hidden;
font-family:Arial,sans-serif;
}

.header{
position:absolute;
top:10px;
left:10px;
display:flex;
gap:10px;
z-index:999;
}

.btn{
background:#2563eb;
color:white;
padding:12px 18px;
border:none;
border-radius:8px;
cursor:pointer;
text-decoration:none;
font-weight:bold;
}

video{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
display:none;
z-index:1;
}

model-viewer{
position:absolute;
top:50%;
left:50%;
width:900px;
height:650px;
transform:translate(-50%,-50%) scale(1);
background:transparent;
opacity:.75;
z-index:2;
}

.info{

position:absolute;
top:20px;
right:20px;

background:rgba(0,0,0,.85);

padding:15px;

border-radius:12px;

width:280px;

color:white;

z-index:999;

}

.painel{

position:absolute;
bottom:20px;
left:20px;

background:rgba(0,0,0,.85);

padding:15px;

border-radius:12px;

width:320px;

color:white;

z-index:999;

}

.caracteristicas{

position:absolute;

top:220px;
right:20px;

background:rgba(0,0,0,.85);

padding:15px;

border-radius:12px;

width:280px;

color:white;

z-index:999;

max-height:350px;

overflow:auto;

}

.item{

padding:8px;
margin-bottom:8px;

background:#1f2937;

border-radius:8px;

}

input{
width:100%;
}

</style>

</head>

<body>

<div class="header">

<a href="/viewer.html"
class="btn">

← Voltar

</a>

<button
class="btn"
onclick="abrirCamera()">

📷 Abrir Câmera

</button>

</div>

<video
id="camera"
autoplay
playsinline>
</video>

<model-viewer
id="modelo"
camera-controls
auto-rotate
shadow-intensity="1">
</model-viewer>

<div class="info">

<h3>Peça Selecionada</h3>

<p id="pnAtual">

Carregando...

</p>

</div>

<div class="caracteristicas">

<h3>Características Críticas</h3>

<div id="listaCaracteristicas">
</div>

</div>

<div class="painel">

<h3>Alinhamento</h3>

<label>X</label>

<input
id="x"
type="range"
min="-800"
max="800"
value="0">

<label>Y</label>

<input
id="y"
type="range"
min="-600"
max="600"
value="0">

<label>Transparência</label>

<input
id="opacity"
type="range"
min="10"
max="100"
value="75">

<label>Zoom</label>

<input
id="zoom"
type="range"
min="50"
max="250"
value="100">

</div>

<div class="item">

☐ ${item.caracteristica}

<br>

<small>
${item.tipo}
</small>

</div>

`;

});
