<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>InspectAR AR</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
color:white;
overflow:hidden;
}

.header{
position:absolute;
top:10px;
left:10px;
z-index:1000;
display:flex;
gap:10px;
}

.btn{
background:#2563eb;
color:white;
border:none;
padding:12px 18px;
border-radius:8px;
cursor:pointer;
text-decoration:none;
font-weight:bold;
}

video{
position:absolute;
top:0;
left:0;
width:100vw;
height:100vh;
object-fit:cover;
display:none;
z-index:1;
}

model-viewer{

position:absolute;

top:50%;
left:50%;

width:500px;
height:500px;

transform:translate(-50%,-50%);

background:transparent;

opacity:.70;

z-index:2;

}

.painel{

position:absolute;
bottom:20px;
left:20px;

background:rgba(0,0,0,.80);

padding:15px;

border-radius:12px;

width:300px;

z-index:1000;

}

.painel h3{
margin-bottom:10px;
}

label{
display:block;
margin-top:10px;
}

input{
width:100%;
}

</style>

</head>
