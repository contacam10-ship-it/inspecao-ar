<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>InspectAR AR</title>

<script type="module"
src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
</script>

<style>

body{
margin:0;
background:#0b1736;
color:white;
font-family:Arial,sans-serif;
overflow:hidden;
}

.header{
position:absolute;
top:10px;
left:10px;
display:flex;
gap:10px;
z-index:999;
}

.btn{
background:#2563eb;
color:white;
padding:12px 18px;
border:none;
border-radius:8px;
cursor:pointer;
text-decoration:none;
font-weight:bold;
}

video{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
display:none;
z-index:1;
}

model-viewer{
position:absolute;
top:50%;
left:50%;
width:900px;
height:650px;
transform:translate(-50%,-50%) scale(1);
background:transparent;
opacity:.75;
z-index:2;
}

.info{
position:absolute;
top:20px;
right:20px;
background:rgba(0,0,0,.85);
padding:15px;
border-radius:12px;
width:280px;
z-index:999;
}

.caracteristicas{
position:absolute;
top:180px;
right:20px;
background:rgba(0,0,0,.85);
padding:15px;
border-radius:12px;
width:280px;
max-height:350px;
overflow:auto;
z-index:999;
}

.item{
padding:10px;
margin-bottom:8px;
background:#1f2937;
border-radius:8px;
}

.painel{
position:absolute;
bottom:20px;
left:20px;
background:rgba(0,0,0,.85);
padding:15px;
border-radius:12px;
width:320px;
z-index:999;
}

input{
width:100%;
}

.status{
margin-top:10px;
color:#22c55e;
font-weight:bold;
}

.erro{
color:#ef4444;
font-weight:bold;
}

</style>

</head>

<body>

<div class="header">

<a href="/viewer.html" class="btn">
← Voltar
</a>

<button
class="btn"
onclick="abrirCamera()">
📷 Abrir Câmera
</button>

</div>

<video
id="camera"
autoplay
playsinline>
</video>

<model-viewer
id="modelo"
camera-controls
auto-rotate
shadow-intensity="1">
</model-viewer>

<div class="info">

<h3>Peça Selecionada</h3>

<p id="pnAtual">
Carregando...
</p>

<div
id="statusModelo"
class="status">
Carregando modelo...
</div>

</div>

<div class="caracteristicas">

<h3>Características Críticas</h3>

<div id="listaCaracteristicas">

Nenhuma característica carregada.

</div>

</div>

<div class="painel">

<h3>Alinhamento</h3>

<label>X</label>

<input
id="x"
type="range"
min="-800"
max="800"
value="0">

<label>Y</label>

<input
id="y"
type="range"
min="-600"
max="600"
value="0">

<label>Transparência</label>

<input
id="opacity"
type="range"
min="10"
max="100"
value="75">

<label>Zoom</label>

<input
id="zoom"
type="range"
min="50"
max="250"
value="100">

</div>

<script>

const modelo =
document.getElementById("modelo");

const modeloSelecionado =
localStorage.getItem("modeloSelecionado");

const pnSelecionado =
localStorage.getItem("pnSelecionado");

const statusModelo =
document.getElementById("statusModelo");

if(modeloSelecionado){

modelo.src =
modeloSelecionado;

statusModelo.innerHTML =
"✅ Modelo carregado";

}else{

statusModelo.className =
"erro";

statusModelo.innerHTML =
"❌ Nenhum modelo selecionado";

}

if(pnSelecionado){

document.getElementById("pnAtual")
.innerHTML =
pnSelecionado;

}else{

document.getElementById("pnAtual")
.innerHTML =
"Nenhuma peça selecionada";

}

const caracteristicas =
JSON.parse(
localStorage.getItem("caracteristicas")
|| "[]"
);

const listaCaracteristicas =
document.getElementById(
"listaCaracteristicas"
);

listaCaracteristicas.innerHTML = "";

const caracteristicasFiltradas =
caracteristicas.filter(item =>
item.pn === pnSelecionado
);

if(caracteristicasFiltradas.length === 0){

listaCaracteristicas.innerHTML =
"Nenhuma característica cadastrada.";

}else{

caracteristicasFiltradas.forEach(item=>{

listaCaracteristicas.innerHTML += `
<div class="item">

☐ ${item.caracteristica}

<br>

<small>
${item.tipo}
</small>

</div>
`;

});

}
