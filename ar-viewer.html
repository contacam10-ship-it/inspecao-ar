<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>InspectAR AR</title>

<script type="module"
src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
</script>

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
margin:0;
background:#0b1736;
color:white;
overflow:hidden;
}

.header{
position:absolute;
top:10px;
left:10px;
display:flex;
gap:10px;
z-index:1000;
}

.btn{
background:#2563eb;
color:white;
padding:12px 18px;
border:none;
border-radius:8px;
cursor:pointer;
text-decoration:none;
font-weight:bold;
}

video{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
display:none;
z-index:1;
}

model-viewer{
position:absolute;
top:50%;
left:50%;
width:900px;
height:650px;
transform:translate(-50%,-50%);
background:transparent;
opacity:0.75;
z-index:2;
}

.info{

position:absolute;
top:20px;
right:20px;

width:300px;

background:rgba(0,0,0,0.85);

padding:15px;

border-radius:12px;

z-index:1000;

}

.caracteristicas{

position:absolute;
top:190px;
right:20px;

width:300px;

background:rgba(0,0,0,0.85);

padding:15px;

border-radius:12px;

z-index:1000;

max-height:400px;

overflow:auto;

}

.item{

padding:10px;

margin-bottom:8px;

background:#1f2937;

border-radius:8px;

}

.painel{

position:absolute;
bottom:20px;
left:20px;

width:350px;

background:rgba(0,0,0,0.85);

padding:15px;

border-radius:12px;

z-index:1000;

}

input{
width:100%;
}

.status-ok{
color:#22c55e;
font-weight:bold;
}

.status-erro{
color:#ef4444;
font-weight:bold;
}

</style>

</head>

<body>

<div class="header">

<a href="/viewer.html" class="btn">
← Voltar
</a>

<button
class="btn"
onclick="abrirCamera()">
📷 Abrir Câmera
</button>

</div>

<video
id="camera"
autoplay
playsinline>
</video>

<model-viewer
id="modelo"
camera-controls
auto-rotate
shadow-intensity="1">
</model-viewer>

<div class="info">

<h3>Peça Selecionada</h3>

<p id="pnAtual">
-
</p>

<p id="statusModelo">
Aguardando
</p>

</div>

<div class="caracteristicas">

<h3>Características Críticas</h3>

<div id="listaCaracteristicas">

Nenhuma característica encontrada.

</div>

</div>

<div class="painel">

<h3>Alinhamento</h3>
