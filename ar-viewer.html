<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>InspectAR AR</title>

<script type="module"
src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
</script>

<style>

body{
margin:0;
background:#0f172a;
color:white;
font-family:Arial,sans-serif;
}

.header{
padding:15px;
background:#111827;
display:flex;
gap:10px;
}

.btn{
background:#2563eb;
color:white;
padding:12px 18px;
border-radius:8px;
text-decoration:none;
font-weight:bold;
}

.layout{
display:grid;
grid-template-columns:1fr 320px;
gap:20px;
padding:20px;
}

.card{
background:#1f2937;
padding:15px;
border-radius:12px;
}

model-viewer{
width:100%;
height:600px;
background:#374151;
border-radius:12px;
}

.item{
background:#374151;
padding:10px;
border-radius:8px;
margin-bottom:8px;
}

</style>

</head>

<body>

<div class="header">

<a href="/viewer.html" class="btn">
← Voltar
</a>

</div>

<div class="layout">

<div class="card">

<h2>
Inspeção AR
</h2>

<p>
PN:
<span id="pnAtual">
-
</span>
</p>

<model-viewer
id="modelo"
camera-controls
auto-rotate>
</model-viewer>

</div>

<div class="card">

<h3>Características Críticas</h3>

<div id="listaCaracteristicas">

Nenhuma característica.

</div>

</div>

</div>

<script>

const params =
new URLSearchParams(
window.location.search
);

const pn =
params.get("pn");

const arquivo =
params.get("arquivo");

document.getElementById(
"pnAtual"
).innerHTML =
pn || "PN não informado";

if(arquivo){

document.getElementById(
"modelo"
).src =
"/modelos/" + arquivo;

}

const caracteristicas =
JSON.parse(
localStorage.getItem(
"caracteristicas"
) || "[]"
);

const area =
document.getElementById(
"listaCaracteristicas"
);

area.innerHTML = "";

const filtradas =
caracteristicas.filter(function(c){

return c.pn === pn;

});

if(filtradas.length === 0){

area.innerHTML =
"Sem características cadastradas.";

}

filtradas.forEach(function(item){

area.innerHTML += `

<div class="item">

<b>${item.caracteristica}</b>

<br>

${item.tipo}

</div>

`;

});

</script>

</body>

</html>
