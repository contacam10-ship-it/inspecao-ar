<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>InspectAR AR Viewer</title>

<script type="module"
src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
</script>

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
margin:0;
background:#0f172a;
color:white;
overflow:hidden;
}

.header{
position:absolute;
top:10px;
left:10px;
display:flex;
gap:10px;
z-index:999;
}

.btn{
background:#2563eb;
color:white;
padding:12px 18px;
border:none;
border-radius:8px;
cursor:pointer;
text-decoration:none;
font-weight:bold;
}

video{
position:absolute;
top:0;
left:0;
width:100vw;
height:100vh;
object-fit:cover;
display:none;
z-index:1;
}

model-viewer{
position:absolute;
top:50%;
left:50%;
width:100vw;
height:100vh;
transform:translate(-50%,-50%);
background:transparent;
z-index:2;
pointer-events:auto;
}

.painel{

position:absolute;
bottom:20px;
left:20px;

background:rgba(0,0,0,.85);

padding:15px;

border-radius:12px;

width:320px;

z-index:999;

}

.painel h3{
margin-top:0;
}

label{
display:block;
margin-top:12px;
font-size:14px;
}

input{
width:100%;
}

.info{

position:absolute;

top:20px;
right:20px;

background:rgba(0,0,0,.85);

padding:15px;

border-radius:12px;

width:260px;

z-index:999;

}

</style>

</head>

<body>

<div class="header">

<a href="/" class="btn">
← Dashboard
</a>

<button class="btn" onclick="abrirCamera()">
📷 Abrir Câmera
</button>

</div>

<video
id="camera"
autoplay
playsinline>
</video>

<model-viewer
id="modelo"
src="/modelos/86699800_prt.glb"
camera-controls
shadow-intensity="1"
