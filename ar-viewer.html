<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>InspectAR - Inspeção AR</title>

<script type="module"
src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
</script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:#0b1220;
color:white;
height:100vh;
overflow:hidden;
}

.header{

height:60px;
background:#111827;

display:flex;
align-items:center;
justify-content:space-between;

padding:0 20px;

border-bottom:1px solid #1f2937;

}

.logo{
font-size:20px;
font-weight:600;
}

.home{

width:42px;
height:42px;

display:flex;
align-items:center;
justify-content:center;

text-decoration:none;

background:#2563eb;

border-radius:10px;

color:white;

font-size:20px;

}

.main{

height:calc(100vh - 60px);

display:grid;

grid-template-columns:1fr 320px;

}

.ar-container{

position:relative;

background:black;

overflow:hidden;

}

#camera{

position:absolute;
inset:0;

width:100%;
height:100%;

object-fit:cover;

z-index:1;

}

#modelo{

position:absolute;

top:50%;
left:50%;

width:100%;
height:100%;

transform:translate(-50%,-50%);

background:transparent;

z-index:2;

opacity:0.8;

pointer-events:none;

}

.sidebar{

background:#111827;

padding:15px;

overflow-y:auto;

border-left:1px solid #1f2937;

}

.card{

background:#1f2937;

padding:15px;

border-radius:12px;

margin-bottom:15px;

}

.card-title{

font-size:12px;

color:#94a3b8;

margin-bottom:10px;

text-transform:uppercase;

}

.feature{

background:#0f172a;

padding:10px;

border-radius:10px;

margin-bottom:8px;

cursor:pointer;

}

.feature:hover{
background:#2563eb;
}

.details{

font-size:14px;

line-height:24px;

}

label{

display:block;

margin-top:10px;

margin-bottom:5px;

font-size:13px;

}

input[type=range]{
width:100%;
}

.btn{

width:100%;

padding:14px;

border:none;

border-radius:10px;

font-weight:bold;

cursor:pointer;

margin-top:10px;

}

.btn-ok{
background:#16a34a;
color:white;
}

.btn-nok{
background:#dc2626;
color:white;
}

@media(max-width:900px){

body{
overflow:auto;
}

.main{

grid-template-columns:1fr;

height:auto;

}

.ar-container{
height:60vh;
}

.sidebar{

border-left:none;

border-top:1px solid #1f2937;

}

}

</style>

</head>

<body>

<div class="header">

<div class="logo">
InspectAR AR
</div>

<a href="/" class="home">
🏠
</a>

</div>

<div class="main">

<div class="ar-container">

<video
id="camera"
autoplay
playsinline
muted>
</video>

<model-viewer
id="modelo"
camera-controls
auto-rotate>
</model-viewer>

</div>

<div class="sidebar">

<div class="card">

<div class="card-title">
PN EM INSPEÇÃO
</div>

<div id="pnAtual">
-
</div>

</div>

<div class="card">

<div class="card-title">
CARACTERÍSTICAS
</div>

<div id="listaCaracteristicas">

Sem características.

</div>

</div>

<div class="card">

<div class="card-title">
CRITÉRIO
</div>

<div
id="detalhes"
class="details">

Selecione uma característica.

</div>

</div>

<div class="card">

<div class="card-title">
ALINHAMENTO CAD
</div>

<label>Transparência</label>

<input
id="opacity"
type="range"
min="10"
max="100"
value="80">

<label>Escala</label>

<input
id="scale"
type="range"
min="50"
max="250"
value="100">

<label>Posição X</label>

<input
id="posx"
type="range"
min="-500"
max="500"
value="0">

<label>Posição Y</label>

<input
id="posy"
type="range"
min="-500"
max="500"
value="0">

</div>

<div class="card">

<button
class="btn btn-ok">
✅ APROVAR
</button>

<button
class="btn btn-nok">
❌ REJEITAR
</button>

</div>

</div>

</div>

<script>

const params =
new URLSearchParams(
window.location.search
);

const pn =
params.get("pn");

const arquivo =
params.get("arquivo");

document.getElementById(
"pnAtual"
).innerHTML =
pn || "-";

const modelo =
document.getElementById(
"modelo"
);

if(arquivo){

modelo.src =
"/modelos/" + arquivo;

}

const caracteristicas =
JSON.parse(
localStorage.getItem(
"caracteristicas"
) || "[]"
);

const lista =
document.getElementById(
"listaCaracteristicas"
);

const detalhes =
document.getElementById(
"detalhes"
);

lista.innerHTML = "";

const filtradas =
caracteristicas.filter(
c => c.pn === pn
);

if(filtradas.length === 0){

lista.innerHTML =
"Sem características cadastradas.";

}

filtradas.forEach(item=>{

const div =
document.createElement("div");

div.className =
"feature";

div.textContent =
item.caracteristica;

div.onclick = () => {

detalhes.innerHTML =

`<b>Tipo:</b><br>${item.tipo || "-"}

<br><br>

<b>Tolerância:</b><br>
±${item.tolerancia || "-"}

<br><br>

<b>Critério:</b><br>
${item.criterio || "-"}`;

};

lista.appendChild(div);

});

async function iniciarCamera(){

try{

const stream =
await navigator.mediaDevices
.getUserMedia({

video:{
facingMode:"environment"
},

audio:false

});

document.getElementById(
"camera"
).srcObject =
stream;

}
catch(error){

alert(
"Falha ao acessar a câmera."
);

}

}

window.addEventListener(
"load",
iniciarCamera
);

function atualizarCAD(){

const opacidade =
document.getElementById(
"opacity"
).value;

const escala =
document.getElementById(
"scale"
).value;

const x =
document.getElementById(
"posx"
).value;

const y =
document.getElementById(
"posy"
).value;

modelo.style.opacity =
opacidade / 100;

modelo.style.left =
`calc(50% + ${x}px)`;

modelo.style.top =
`calc(50% + ${y}px)`;

modelo.style.transform =
`translate(-50%,-50%) scale(${escala/100})`;

}

document
.getElementById("opacity")
.addEventListener(
"input",
atualizarCAD
);

document
.getElementById("scale")
.addEventListener(
"input",
atualizarCAD
);

document
.getElementById("posx")
.addEventListener(
"input",
atualizarCAD
);

document
.getElementById("posy")
.addEventListener(
"input",
atualizarCAD
);

</script>

</body>

</html>
