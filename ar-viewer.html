<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<title>InspectAR AR</title>

<script type="module"
src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
</script>

<style>

body{
margin:0;
background:#0f172a;
color:white;
font-family:Arial,sans-serif;
}

.topo{
background:#111827;
padding:15px;
}

.btn{
background:#2563eb;
color:white;
padding:12px 18px;
text-decoration:none;
border-radius:8px;
}

.info{
padding:20px;
}

model-viewer{
width:100%;
height:500px;
background:#374151;
}

.card{
background:#1f2937;
margin:10px;
padding:12px;
border-radius:8px;
}

</style>

</head>

<body>

<div class="topo">

<a
href="/viewer.html"
class="btn">

← Voltar

</a>

</div>

<div class="info">

<h2>

PN:
<span id="pnAtual">
-
</span>

</h2>

</div>

<model-viewer
id="modelo"
camera-controls
auto-rotate>
</model-viewer>

<div id="caracteristicas">
</div>

<script>

const pn =
localStorage.getItem(
"pnSelecionado"
);

const modelo =
localStorage.getItem(
"modeloSelecionado"
);

document.getElementById(
"pnAtual"
).innerHTML =
pn || "PN não encontrado";

if(modelo){

document.getElementById(
"modelo"
).src =
modelo;

}

const caracteristicas =
JSON.parse(
localStorage.getItem(
"caracteristicas"
) || "[]"
);

const area =
document.getElementById(
"caracteristicas"
);

const filtradas =
caracteristicas.filter(function(c){

return c.pn == pn;

});

if(filtradas.length === 0){

area.innerHTML =
"<div class='card'>Nenhuma característica encontrada.</div>";

}

filtradas.forEach(function(item){

area.innerHTML += `
<div class="card">

<b>${item.caracteristica}</b>
<br>
${item.tipo}

</div>
`;

});

</script>

</body>

</html>
