<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>InspectAR - Ambiente AR</title>

<script type="module"
src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
</script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
color:white;
overflow:hidden;
}

.header{
background:#111827;
padding:15px;
display:flex;
gap:10px;
}

.btn{
background:#2563eb;
color:white;
padding:12px 18px;
border-radius:8px;
text-decoration:none;
font-weight:bold;
border:none;
cursor:pointer;
}

.btn-camera{
background:#16a34a;
}

.layout{
display:grid;
grid-template-columns:1fr 320px;
gap:20px;
padding:20px;
height:calc(100vh - 80px);
}

.viewer-area{
position:relative;
background:#1f2937;
border-radius:12px;
overflow:hidden;
}

video{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
display:none;
z-index:1;
}

model-viewer{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:transparent;
z-index:2;
opacity:0.8;
}

.painel{
background:#1f2937;
padding:15px;
border-radius:12px;
overflow:auto;
}

.item{
background:#374151;
padding:10px;
border-radius:8px;
margin-bottom:10px;
}

.slider{
width:100%;
}

.info{
margin-bottom:20px;
line-height:28px;
}

</style>

</head>

<body>

<div class="header">

<a href="/viewer.html" class="btn">
← Voltar
</a>

<button
class="btn btn-camera"
onclick="abrirCamera()">

📷 Abrir Câmera

</button>

</div>

<div class="layout">

<div class="viewer-area">

<video
id="camera"
autoplay
playsinline>
</video>

<model-viewer
id="modelo"
camera-controls
auto-rotate>
</model-viewer>

</div>

<div class="painel">

<h2>Inspeção</h2>

<div class="info">

<b>PN:</b>

<span id="pnAtual">
-
</span>

</div>

<h3>Características</h3>

<div id="listaCaracteristicas">

Nenhuma característica.

</div>

<hr style="margin:20px 0;">

<h3>Overlay CAD</h3>

<br>

<label>Transparência</label>

<input
id="opacity"
class="slider"
type="range"
min="10"
max="100"
value="80">

</div>

</div>

<script>

const params =
new URLSearchParams(
window.location.search
);

const pn =
params.get("pn");

const arquivo =
params.get("arquivo");

document.getElementById(
"pnAtual"
).innerHTML =
pn || "-";

if(arquivo){

document.getElementById(
"modelo"
).src =
"/modelos/" + arquivo;

}

const caracteristicas =
JSON.parse(
localStorage.getItem(
"caracteristicas"
) || "[]"
);

const area =
document.getElementById(
"listaCaracteristicas"
);

area.innerHTML = "";

const filtradas =
caracteristicas.filter(
c => c.pn === pn
);

if(filtradas.length === 0){

area.innerHTML =
"Sem características cadastradas.";

}

filtradas.forEach(item=>{

area.innerHTML += `

<div class="item">

☐ ${item.caracteristica}

<br>

<small>
${item.tipo}
</small>

</div>

`;

});

async function abrirCamera(){

const video =
document.getElementById(
"camera"
);

try{

const stream =
await navigator.mediaDevices
.getUserMedia({

video:{
facingMode:"environment"
}

});

video.srcObject =
stream;

video.style.display =
"block";

}
catch(e){

alert(
"Não foi possível acessar a câmera."
);

}

}

document
.getElementById("opacity")
.addEventListener(
"input",
function(){

document
.getElementById("modelo")
.style.opacity =
this.value / 100;

});

</script>

</body>

</html>
