<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>InspectAR - Inspeção</title>

<script type="module"
src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
</script>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#0f172a;
color:white;
font-family:Arial,sans-serif;
}

.header{
background:#111827;
padding:15px;
}

.btn{
background:#2563eb;
color:white;
padding:12px 18px;
border:none;
border-radius:8px;
text-decoration:none;
cursor:pointer;
font-weight:bold;
}

.container{
max-width:1400px;
margin:auto;
padding:20px;
}

.lista{
display:flex;
flex-wrap:wrap;
gap:10px;
margin-bottom:20px;
}

.modelo{
background:#374151;
color:white;
border:none;
padding:12px 20px;
border-radius:8px;
cursor:pointer;
}

.card{
background:#1f2937;
padding:20px;
border-radius:12px;
}

model-viewer{
width:100%;
height:500px;
background:#374151;
border-radius:12px;
}

.info{
margin-top:20px;
line-height:1.8;
}

.inspecionar{
margin-top:20px;
background:#16a34a;
color:white;
padding:14px 20px;
border:none;
border-radius:8px;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

.erro{
background:#dc2626;
padding:15px;
border-radius:8px;
}

</style>

</head>

<body>

<div class="header">

<a href="/" class="btn">
← Dashboard
</a>

</div>

<div class="container">

<h2>Modelos Disponíveis</h2>

<div
id="listaModelos"
class="lista">

</div>

<div class="card">

<h2 id="titulo">
Selecione uma peça
</h2>

<model-viewer
id="viewer"
camera-controls
auto-rotate>
</model-viewer>

<div class="info">

<p>
<b>PN:</b>
<span id="pn">-</span>
</p>

<p>
<b>Descrição:</b>
<span id="descricao">-</span>
</p>

</div>

<button
class="inspecionar"
onclick="iniciarInspecao()">
🔍 Iniciar Inspeção
</button>

</div>

</div>

<script>

let modeloSelecionado = null;

const modelos =
JSON.parse(
localStorage.getItem("modelos") || "[]"
);

const listaModelos =
document.getElementById("listaModelos");

if(modelos.length === 0){

listaModelos.innerHTML = `
<div class="erro">
Nenhum modelo cadastrado.
Cadastre modelos primeiro.
</div>
`;

}

modelos.forEach(function(modelo){

const botao =
document.createElement("button");

botao.className =
"modelo";

botao.innerHTML =
modelo.pn;

botao.onclick = function(){

modeloSelecionado =
modelo;

document.getElementById("viewer").src =
"/modelos/" + modelo.arquivo;

document.getElementById("titulo").innerHTML =
modelo.pn;

document.getElementById("pn").innerHTML =
modelo.pn;

document.getElementById("descricao").innerHTML =
modelo.descricao;

};

listaModelos.appendChild(botao);

});

function iniciarInspecao(){

if(modeloSelecionado === null){

alert(
"Selecione uma peça primeiro."
);

return;

}

localStorage.setItem(
"pnSelecionado",
modeloSelecionado.pn
);

localStorage.setItem(
"modeloSelecionado",
"/modelos/" +
modeloSelecionado.arquivo
);

window.location.href =
"/ar-viewer.html";

}

</script>

</body>

</html>
