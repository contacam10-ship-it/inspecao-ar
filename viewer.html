<script>

let modeloSelecionado = null;

const modelos =
JSON.parse(
localStorage.getItem("modelos") || "[]"
);

const lista =
document.getElementById("listaModelos");

modelos.forEach(modelo=>{

const btn =
document.createElement("button");

btn.className =
"modelo";

btn.innerHTML =
modelo.pn;

btn.onclick = function(){

modeloSelecionado = modelo;

document.getElementById("viewer").src =
"/modelos/" + modelo.arquivo;

document.getElementById("titulo").innerHTML =
modelo.pn;

document.getElementById("pn").innerHTML =
modelo.pn;

document.getElementById("descricao").innerHTML =
modelo.descricao;

};

lista.appendChild(btn);

});

function inspecionar(){

if(!modeloSelecionado){

alert(
"Selecione uma peça primeiro."
);

return;

}

localStorage.setItem(
"pnSelecionado",
modeloSelecionado.pn
);

localStorage.setItem(
"modeloSelecionado",
"/modelos/" + modeloSelecionado.arquivo
);

window.location.href =
"/ar-viewer.html";

}

</script>
