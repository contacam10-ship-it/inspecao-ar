<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>InspectAR - Inspeção</title>

<script type="module"
src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
</script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
color:white;
}

.header{
background:#111827;
padding:20px;
}

.btn{
background:#2563eb;
color:white;
padding:12px 18px;
border-radius:8px;
text-decoration:none;
font-weight:bold;
}

.container{
padding:20px;
max-width:1400px;
margin:auto;
}

.layout{
display:grid;
grid-template-columns:300px 1fr;
gap:20px;
}

.card{
background:#1f2937;
padding:20px;
border-radius:12px;
}

.lista button{

width:100%;

padding:12px;

margin-bottom:10px;

background:#374151;

border:none;

border-radius:8px;

color:white;

cursor:pointer;

}

model-viewer{

width:100%;
height:600px;

background:#374151;

border-radius:12px;

}

.info{

margin-top:20px;

line-height:30px;

}

.inspecionar{

margin-top:20px;

background:#16a34a;

color:white;

padding:14px 20px;

border:none;

border-radius:8px;

cursor:pointer;

font-size:16px;

font-weight:bold;

}

.erro{

background:#dc2626;

padding:10px;

border-radius:8px;

margin-top:10px;

}

</style>

</head>

<body>

<div class="header">

<a href="/" class="btn">

← Dashboard

</a>

</div>

<div class="container">

<div class="layout">

<div class="card">

<h2>Modelos Disponíveis</h2>

<br>

<div
id="listaModelos"
class="lista">

</div>

</div>

<div class="card">

<h2 id="titulo">

Selecione um modelo

</h2>

<br>

<model-viewer
id="viewer"
camera-controls
auto-rotate>

</model-viewer>

<div class="info">

<p>

<b>PN:</b>

<span id="pn">

-

</span>

</p>

<p>

<b>Descrição:</b>

<span id="descricao">

-

</span>

</p>

</div>

<button
class="inspecionar"
onclick="iniciarInspecao()">

🔍 Iniciar Inspeção

</button>

<div
id="status">

</div>

</div>

</div>

</div>

<script>

let modeloAtual = null;

const modelos =
JSON.parse(
localStorage.getItem("modelos")
|| "[]"
);

const lista =
document.getElementById(
"listaModelos"
);

if(modelos.length === 0){

lista.innerHTML =
`
<div class="erro">

Nenhum modelo cadastrado.

</div>
`;

}

modelos.forEach(function(modelo){

const btn =
document.createElement("button");

btn.innerHTML =
modelo.pn;

btn.onclick = function(){

modeloAtual =
modelo;

document.getElementById(
"titulo"
).innerHTML =
modelo.pn;

document.getElementById(
"pn"
).innerHTML =
modelo.pn;

document.getElementById(
"descricao"
).innerHTML =
modelo.descricao;

document.getElementById(
"viewer"
).src =
"/modelos/" +
modelo.arquivo;

};

lista.appendChild(btn);

});

function iniciarInspecao(){

if(!modeloAtual){

alert(
"Selecione uma peça primeiro."
);

return;

}

window.location.href =
"/ar-viewer.html?pn=" +
encodeURIComponent(
modeloAtual.pn
)
+
"&arquivo=" +
encodeURIComponent(
modeloAtual.arquivo
);

}

</script>

</body>

</html>
