<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <title>InspectAR - Modelo 3D</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer@4.1.0/dist/model-viewer.min.js"></script>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#0b1220;color:#fff}
    *{box-sizing:border-box}body{margin:0;min-height:100vh}.header{height:60px;background:#111827;border-bottom:1px solid #1f2937;display:flex;align-items:center;justify-content:space-between;padding:0 16px}.logo{font-size:20px;font-weight:700}.home{color:#fff;text-decoration:none;background:#2563eb;border-radius:10px;padding:10px 14px}
    main{max-width:1100px;margin:0 auto;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px}.panel{background:#111827;border:1px solid #1f2937;border-radius:14px;padding:16px}.stage{position:relative;min-height:60vh;background:#020617;border-radius:10px;overflow:hidden}model-viewer{width:100%;height:60vh;min-height:360px;background:#020617;--poster-color:transparent}.ar-button{border:0;border-radius:10px;background:#2563eb;color:#fff;padding:12px 16px;font-weight:700;margin:12px;cursor:pointer}.hint,.status{font-size:13px;line-height:1.5;color:#cbd5e1}.hint{padding-top:12px}.status{min-height:24px;margin-top:12px}.list{display:grid;gap:8px}.model-button{width:100%;padding:13px;text-align:left;border:1px solid #334155;border-radius:9px;background:#1f2937;color:#fff;font-size:16px;font-weight:650;cursor:pointer}.model-button[aria-current="true"]{border-color:#60a5fa;background:#1e3a8a}.muted{color:#94a3b8}.description{line-height:1.5;overflow-wrap:anywhere;margin-top:8px}.empty{color:#cbd5e1;line-height:1.5}
    @media(max-width:760px){main{grid-template-columns:1fr;padding:12px}.stage,model-viewer{height:52vh;min-height:300px}.panel{padding:13px}.header{padding:0 12px}}
  </style>
</head>
<body>
  <header class="header"><div class="logo">InspectAR <span class="muted">/ Modelo 3D</span></div><a class="home" href="/">Início</a></header>
  <main>
    <section class="panel">
      <h1 id="title" style="font-size:20px;margin:0 0 12px">Modelo 3D</h1>
      <div class="stage">
        <model-viewer id="viewer" camera-controls touch-action="pan-y" auto-rotate shadow-intensity="1" ar ar-modes="scene-viewer quick-look webxr" ar-scale="auto" interaction-prompt="auto" alt="Modelo 3D da peça">
          <button slot="ar-button" class="ar-button" type="button">Ver no espaço (RA)</button>
        </model-viewer>
      </div>
      <div id="status" class="status" role="status">Carregando modelo…</div>
      <p class="hint">No celular, arraste para girar e use dois dedos para aproximar. Toque em “Ver no espaço (RA)” para abrir a visualização de realidade aumentada, quando disponível no aparelho e navegador.</p>
    </section>
    <aside class="panel">
      <h2 style="font-size:18px;margin:0 0 12px">Peças disponíveis</h2>
      <div id="list" class="list"></div>
      <div id="details" class="description muted"></div>
    </aside>
  </main>
  <script>
    (() => {
      "use strict";
      const publicModels = [
        { pn: "86699800", descricao: "Modelo 3D disponível no catálogo online", arquivo: "86699800_prt.glb" }
      ];
      const params = new URLSearchParams(location.search);
      const requestedPn = params.get("pn");
      const requestedFile = params.get("arquivo");
      const viewer = document.getElementById("viewer");
      const status = document.getElementById("status");
      const list = document.getElementById("list");
      let selectedModel = null;

      function safeFilename(value) {
        if (typeof value !== "string") return "";
        const filename = value.split(/[\\/]/).pop();
        return /^[\w.-]+\.(?:glb|gltf)$/i.test(filename) && !filename.startsWith(".") ? filename : "";
      }
      function readSavedModels() {
        try {
          const parsed = JSON.parse(localStorage.getItem("modelos") || "[]");
          return Array.isArray(parsed) ? parsed.filter((item) => item && item.pn && safeFilename(item.arquivo)) : [];
        } catch (error) {
          console.warn("Não foi possível ler modelos locais", error);
          return [];
        }
      }
      const models = [...publicModels];
      for (const saved of readSavedModels()) {
        const index = models.findIndex((item) => String(item.pn) === String(saved.pn));
        if (index >= 0) models[index] = { ...models[index], ...saved };
        else models.push(saved);
      }
      if (requestedPn && requestedFile && safeFilename(requestedFile) && !models.some((item) => String(item.pn) === requestedPn)) {
        models.push({ pn: requestedPn, descricao: "", arquivo: safeFilename(requestedFile) });
      }

      function selectModel(model) {
        const filename = safeFilename(model.arquivo);
        if (!filename) {
          status.textContent = "Nome de arquivo GLB/GLTF inválido.";
          return;
        }
        selectedModel = model;
        document.getElementById("title").textContent = `Peça ${model.pn}`;
        document.getElementById("details").textContent = model.descricao || "Modelo 3D cadastrado.";
        document.querySelectorAll(".model-button").forEach((button) => {
          button.setAttribute("aria-current", String(button.dataset.pn === String(model.pn)));
        });
        const assetUrl = `https://raw.githubusercontent.com/contacam10-ship-it/inspecao-ar/main/modelos/${encodeURIComponent(filename)}`;
        viewer.src = assetUrl;
        status.textContent = "Buscando o modelo 3D…";
        history.replaceState(null, "", `/viewer?pn=${encodeURIComponent(model.pn)}&arquivo=${encodeURIComponent(filename)}`);
      }
      viewer.addEventListener("load", () => { status.textContent = "Modelo carregado. Você pode girar, ampliar ou abrir em RA."; });
      viewer.addEventListener("error", () => { status.textContent = "Não foi possível carregar o arquivo 3D. Verifique a conexão e tente novamente."; });
      if (!models.length) {
        list.innerHTML = '<div class="empty">Nenhum modelo disponível.</div>';
      } else {
        for (const model of models) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "model-button";
          button.dataset.pn = String(model.pn);
          button.textContent = `PN ${model.pn}`;
          button.addEventListener("click", () => selectModel(model));
          list.appendChild(button);
        }
        const chosen = models.find((item) => String(item.pn) === requestedPn && (!requestedFile || safeFilename(requestedFile) === safeFilename(item.arquivo))) || models[0];
        selectModel(chosen);
      }
    })();
  </script>
</body>
</html>
