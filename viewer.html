<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>InspectAR Viewer</title>

  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    body {
      margin: 0;
      background: #111827;
      color: white;
      font-family: Arial, sans-serif;
    }

    .topbar {
      padding: 15px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn {
      background: #2563eb;
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      font-size: 14px;
    }

    .btn-camera {
      background: #16a34a;
    }

    h1 {
      text-align: center;
      margin-top: 0;
    }

    #camera {
      width: 400px;
      max-width: 95%;
      margin: 0 auto 20px auto;
      display: none;
      border-radius: 10px;
      border: 2px solid #374151;
    }

    model-viewer {
      width: 100%;
      height: 70vh;
      background: #1f2937;
    }
  </style>

</head>

<body>

  <div class="topbar">

    <a href="/" class="btn">
      ← Voltar
    </a>

    <button class="btn btn-camera" onclick="abrirCamera()">
      📷 Abrir Câmera
    </button>

  </div>

  <h1>InspectAR 3D Viewer</h1>

  <video id="camera" autoplay playsinline></video>

  <model-viewer
    src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
    camera-controls
    auto-rotate
    shadow-intensity="1">
  </model-viewer>

  <script>
    async function abrirCamera() {

      const video = document.getElementById('camera');

      try {

        const stream = await navigator.mediaDevices.getUserMedia({
          video: true
        });

        video.srcObject = stream;
        video.style.display = 'block';

      } catch (erro) {

        alert('Não foi possível acessar a câmera.');

        console.error(erro);

      }
    }
  </script>

</body>

</html>
