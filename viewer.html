<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>InspectAR - Modelos</title>

<script type="module"
src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
</script>

<style>

body{
margin:0;
background:#0f172a;
color:white;
font-family:Arial,sans-serif;
}

.header{
padding:15px;
display:flex;
gap:10px;
background:#111827;
}

.btn{
background:#2563eb;
color:white;
padding:12px 18px;
border:none;
border-radius:8px;
text-decoration:none;
cursor:pointer;
font-weight:bold;
}

.container{
display:flex;
gap:20px;
padding:20px;
flex-wrap:wrap;
}

.lista{
width:320px;
background:#1f2937;
padding:15px;
border-radius:12px;
}

.lista button{
width:100%;
margin-bottom:10px;
padding:12px;
background:#374151;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

.detalhes{
flex:1;
background:#1f2937;
padding:20px;
border-radius:12px;
}

model-viewer{
width:100%;
height:450px;
background:#374151;
border-radius:12px;
}

.info{
margin-top:20px;
line-height:1.8;
}

.inspecionar{
margin-top:20px;
background:#16a34a;
color:white;
padding:14px 20px;
border:none;
border-radius:8px;
cursor:pointer;
font-size:16px;
font-weight:bold;
}

</style>

</head>

<body>

<div class="header">

<a href="/" class="btn">
← Dashboard
</a>

</div>

<div class="container">

<div class="lista">

<h3>Modelos Cadastrados</h3>

<button onclick="selecionarModelo(
'86699800_prt',
'/modelos/86699800_prt.glb',
'Pino de Fixação'
)">
86699800_prt
</button>

</div>

<div class="detalhes">

<h2 id="titulo">
Selecione um modelo
</h2>

<model-viewer
id="viewer"
camera-controls
auto-rotate>
</model-viewer>

<div class="info">

<p>
<b>PN:</b>
<span id="pn">-</span>
</p>

<p>
<b>Descrição:</b>
<span id="descricao">-</span>
</p>

<p>
<b>Status:</b>
Ativo
</p>

</div>

<button
class="inspecionar"
onclick="inspecionar()">
🔍 Inspecionar
</button>

</div>

</div>

<script>

let modeloSelecionado = '';

function selecionarModelo(
pn,
arquivo,
descricao
){

modeloSelecionado = arquivo;

document
.getElementById('viewer')
.src = arquivo;

document
.getElementById('titulo')
.innerHTML = pn;

document
.getElementById('pn')
.innerHTML = pn;

document
.getElementById('descricao')
.innerHTML = descricao;

localStorage.setItem(
'modeloSelecionado',
arquivo
);

localStorage.setItem(
'pnSelecionado',
pn
);

}

function inspecionar(){

if(!modeloSelecionado){

alert(
'Selecione um modelo primeiro'
);

return;

}

window.location.href =
'/ar-viewer.html';

}

</script>

</body>

</html>
