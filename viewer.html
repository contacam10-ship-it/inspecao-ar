<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>InspectAR - Inspecionar</title>

<script type="module"
src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
</script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:#0b1220;
color:white;
min-height:100vh;
}

.header{
background:#111827;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #1f2937;
}

.logo{
font-size:24px;
font-weight:700;
}

.btn-home{
background:#2563eb;
width:48px;
height:48px;
display:flex;
align-items:center;
justify-content:center;
border-radius:12px;
text-decoration:none;
color:white;
font-size:22px;
transition:.2s;
}

.btn-home:hover{
background:#1d4ed8;
}

.container{
max-width:1400px;
margin:auto;
padding:20px;
}

.layout{
display:grid;
grid-template-columns:280px 1fr;
gap:20px;
}

.card{
background:#111827;
border:1px solid #1f2937;
border-radius:16px;
padding:20px;
}

.card h2{
margin-bottom:15px;
}

.lista-modelos{
display:flex;
flex-direction:column;
gap:10px;
}

.modelo-btn{

width:100%;
padding:14px;

background:#1f2937;

border:none;

border-radius:10px;

text-align:left;

color:white;

cursor:pointer;

font-weight:600;

transition:.2s;

}

.modelo-btn:hover{
background:#2563eb;
}

.viewer-area{
display:flex;
flex-direction:column;
gap:20px;
}

model-viewer{
width:100%;
height:350px;
background:#0f172a;
border-radius:12px;
}

.info-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

.info-card{
background:#1f2937;
padding:15px;
border-radius:12px;
}

.info-title{
font-size:12px;
color:#94a3b8;
margin-bottom:6px;
}

.info-value{
font-size:16px;
font-weight:600;
}

.status{
background:#1f2937;
padding:12px;
border-radius:10px;
color:#94a3b8;
}

.inspecionar{

width:100%;

padding:16px;

background:#16a34a;

border:none;

border-radius:12px;

color:white;

font-size:16px;

font-weight:bold;

cursor:pointer;

transition:.2s;

}

.inspecionar:hover{
background:#15803d;
}

@media(max-width:1000px){

.layout{
grid-template-columns:1fr;
}

.info-grid{
grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<div class="header">

<div class="logo">
InspectAR
</div>

<a href="/" class="btn-home">
🏠
</a>

</div>

<div class="container">

<div class="layout">

<!-- LISTA DE PNs -->

<div class="card">

<h2>Peças Cadastradas</h2>

<div
id="listaModelos"
class="lista-modelos">

</div>

</div>

<!-- DETALHES -->

<div class="card">

<div class="viewer-area">

<h2 id="titulo">

Selecione um PN

</h2>

<model-viewer
id="viewer"
camera-controls
auto-rotate
shadow-intensity="1">

</model-viewer>

<div class="info-grid">

<div class="info-card">

<div class="info-title">
PN
</div>

<div
id="pn"
class="info-value">

-

</div>

</div>

<div class="info-card">

<div class="info-title">
Características
</div>

<div
id="qtdCaracteristicas"
class="info-value">

0

</div>

</div>

</div>

<div class="info-card">

<div class="info-title">
Descrição
</div>

<div
id="descricao"
class="info-value">

-

</div>

</div>

<button
class="inspecionar"
onclick="iniciarInspecao()">

🔍 Iniciar Inspeção

</button>

<div
id="status"
class="status">

Selecione uma peça para iniciar.

</div>

</div>

</div>

</div>

</div>

<script>

let modeloSelecionado = null;

const modelos =
JSON.parse(
localStorage.getItem("modelos")
|| "[]"
);

const caracteristicas =
JSON.parse(
localStorage.getItem("caracteristicas")
|| "[]"
);

const lista =
document.getElementById(
"listaModelos"
);

if(modelos.length === 0){

lista.innerHTML =
"Não existem modelos cadastrados.";

}

modelos.forEach(function(modelo){

const btn =
document.createElement("button");

btn.className =
"modelo-btn";

btn.innerHTML =
modelo.pn;

btn.onclick = function(){

modeloSelecionado =
modelo;

document.getElementById(
"titulo"
).innerHTML =
modelo.pn;

document.getElementById(
"pn"
).innerHTML =
modelo.pn;

document.getElementById(
"descricao"
).innerHTML =
modelo.descricao;

document.getElementById(
"viewer"
).src =
"/modelos/" +
modelo.arquivo;

const quantidade =
caracteristicas.filter(
c => c.pn === modelo.pn
).length;

document.getElementById(
"qtdCaracteristicas"
).innerHTML =
quantidade;

document.getElementById(
"status"
).innerHTML =
"✅ Modelo carregado.";

};

lista.appendChild(btn);

});

function iniciarInspecao(){

if(!modeloSelecionado){

alert(
"Selecione uma peça primeiro."
);

return;

}

window.location.href =
"/ar-viewer.html?pn="
+
encodeURIComponent(
modeloSelecionado.pn
)
+
"&arquivo="
+
encodeURIComponent(
modeloSelecionado.arquivo
);

}

</script>

</body>

</html>
