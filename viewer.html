<script>

let modeloSelecionado = '';

function carregarLista(){

const modelos =
JSON.parse(
localStorage.getItem("modelos")
|| "[]"
);

const lista =
document.querySelector(".lista");

lista.innerHTML =
"<h3>Modelos Disponíveis</h3>";

modelos.forEach(modelo=>{

lista.innerHTML += `

<button
class="modelo-btn"
onclick="carregarModelo(
'${modelo.pn}',
'${modelo.descricao}',
'/modelos/${modelo.arquivo}'
)">
${modelo.pn}
</button>

`;

});

}

function carregarModelo(
pn,
descricao,
arquivo
){

modeloSelecionado =
arquivo;

document.getElementById("viewer").src =
arquivo;

document.getElementById("titulo").innerHTML =
pn;

document.getElementById("pn").innerHTML =
pn;

document.getElementById("descricao").innerHTML =
descricao;

localStorage.setItem(
"modeloSelecionado",
arquivo
);

localStorage.setItem(
"pnSelecionado",
pn
);

}

function inspecionar(){

if(!modeloSelecionado){

alert(
"Selecione um modelo"
);

return;

}

window.location.href =
"/ar-viewer.html";

}

carregarLista();

</script>
