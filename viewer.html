<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>InspectAR AR Viewer</title>

<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<style>

body{
margin:0;
background:#111827;
color:white;
font-family:Arial,sans-serif;
}

.header{
padding:15px;
background:#0f172a;
display:flex;
gap:10px;
}

.btn{
background:#2563eb;
color:white;
padding:10px 15px;
border:none;
border-radius:8px;
text-decoration:none;
cursor:pointer;
}

.container{
display:flex;
flex-wrap:wrap;
gap:20px;
padding:20px;
justify-content:center;
}

.card{
background:#1f2937;
border-radius:12px;
padding:15px;
}

#camera{
width:500px;
height:400px;
background:black;
display:none;
border-radius:10px;
}

model-viewer{
width:500px;
height:400px;
background:#374151;
border-radius:10px;
}

</style>

</head>

<body>

<div class="header">

<a href="/" class="btn">
← Dashboard
</a>

<button class="btn" onclick="abrirCamera()">
📷 Abrir Câmera
</button>

</div>

<div class="container">

<div class="card">

<h3>Câmera</h3>

<video
id="camera"
autoplay
playsinline>
</video>

</div>

<div class="card">

<h3>Modelo 3D</h3>

<model-viewer
src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
camera-controls
auto-rotate>
</model-viewer>

</div>

</div>

<script>

async function abrirCamera(){

const video =
document.getElementById("camera");

try{

const stream =
await navigator.mediaDevices.getUserMedia({
video:true
});

video.srcObject = stream;
video.style.display = "block";

}catch(e){

alert("Erro ao abrir câmera");

}

}

</script>

</body>

</html>
