<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>InspectAR Viewer</title>

  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    body{
      margin:0;
      background:#111827;
      color:white;
      font-family:Arial;
    }

    h1{
      text-align:center;
      padding:20px;
    }

    model-viewer{
      width:100%;
      height:80vh;
      background:#1f2937;
    }
  </style>

</head>

<body>

<h1>InspectAR 3D Viewer</h1>

<model-viewer
camera-controls
auto-rotate>
</model-viewer>

</body>
</html>
