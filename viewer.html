<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>InspectAR - Seleção de Peça</title>

<script type="module"
src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
</script>

<style>

body{
margin:0;
background:#0f172a;
color:white;
font-family:Arial,sans-serif;
}

.header{
padding:15px;
background:#111827;
}

.btn{
background:#2563eb;
color:white;
padding:12px 18px;
text-decoration:none;
border-radius:8px;
font-weight:bold;
}

.container{
padding:20px;
}

.lista{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-bottom:20px;
}

.modelo-btn{
background:#374151;
border:none;
color:white;
padding:12px 20px;
border-radius:8px;
cursor:pointer;
}

.card{
background:#1f2937;
padding:20px;
border-radius:12px;
}

model-viewer{
width:100%;
height:500px;
background:#374151;
border-radius:12px;
}

.info{
margin-top:20px;
}

.inspecionar{
margin-top:20px;
background:#16a34a;
color:white;
border:none;
padding:15px 20px;
border-radius:8px;
cursor:pointer;
font-size:16px;
font-weight:bold;
}

</style>

</head>

<body>

<div class="header">

<a href="/" class="btn">
← Dashboard
</a>

</div>

<div class="container">

<h2>Modelos Disponíveis</h2>

<div id="listaModelos" class="lista">
</div>

<div class="card">

<h2 id="titulo">
Selecione uma peça
</h2>

<model-viewer
id="viewer"
camera-controls
auto-rotate>
</model-viewer>

<div class="info">

<p>
<b>PN:</b>
<span id="pn">-</span>
</p>

<p>
<b>Descrição:</b>
<span id="descricao">-</span>
</p>

</div>

<button
class="inspecionar"
onclick="iniciarInspecao()">

🔍 Iniciar Inspeção

</button>

</div>

</div>

<script>

let modeloAtual = null;

const modelos =
JSON.parse(
localStorage.getItem("modelos")
|| "[]"
);

const lista =
document.getElementById("listaModelos");

modelos.forEach(function(modelo){

const btn =
document.createElement("button");

btn.className =
"modelo-btn";

btn.innerHTML =
modelo.pn;

btn.onclick = function(){

modeloAtual = modelo;

document.getElementById("viewer").src =
"/modelos/" + modelo.arquivo;

document.getElementById("titulo").innerHTML =
modelo.pn;

document.getElementById("pn").innerHTML =
modelo.pn;

document.getElementById("descricao").innerHTML =
modelo.descricao;

};

lista.appendChild(btn);

});

function iniciarInspecao(){

if(!modeloAtual){

alert(
"Selecione uma peça primeiro."
);

return;

}

window.location.href =
"/ar-viewer.html?pn=" +
encodeURIComponent(modeloAtual.pn)
+
"&arquivo=" +
encodeURIComponent(modeloAtual.arquivo);

}

</script>

</body>

</html>
