<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>InspectAR AR Viewer</title>

<script type="module"
src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
</script>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#111827;
color:white;
font-family:Arial,sans-serif;
}

.header{
background:#0f172a;
padding:15px;
display:flex;
gap:10px;
align-items:center;
flex-wrap:wrap;
}

.btn{
background:#2563eb;
color:white;
padding:10px 20px;
border:none;
border-radius:8px;
cursor:pointer;
text-decoration:none;
font-weight:bold;
}

.camera-btn{
background:#16a34a;
}

.container{
position:relative;
width:100%;
height:calc(100vh - 70px);
overflow:hidden;
}

video{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
display:none;
background:black;
}

model-viewer{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:500px;
height:500px;
background:transparent;
opacity:.7;
}

.controls{
position:absolute;
bottom:20px;
left:20px;
background:rgba(0,0,0,.8);
padding:15px;
border-radius:12px;
width:320px;
z-index:100;
}

.controls h3{
margin-top:0;
}

label{
display:block;
margin-top:10px;
margin-bottom:5px;
}

input{
width:100%;
}

.info{
position:absolute;
top:20px;
right:20px;
width:280px;
background:rgba(0,0,0,.8);
padding:15px;
border-radius:12px;
z-index:100;
}

.status{
font-weight:bold;
color:#22c55e;
}

</style>

</head>

<body>
