<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>InspectAR - Inspeção</title>

<script type="module"
src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
</script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',Arial,sans-serif;
}

body{
background:#0b1220;
color:white;
min-height:100vh;
}

.header{
background:#111827;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #1f2937;
}

.logo{
font-size:24px;
font-weight:700;
}

.btn{
background:#2563eb;
color:white;
text-decoration:none;
padding:12px 18px;
border-radius:10px;
font-weight:600;
}

.container{
max-width:1600px;
margin:auto;
padding:20px;
}

.layout{
display:grid;
grid-template-columns:280px 1fr 320px;
gap:20px;
}

.card{
background:#111827;
border:1px solid #1f2937;
border-radius:16px;
padding:20px;
}

.card h2{
font-size:18px;
margin-bottom:15px;
}

.lista-modelos{
display:flex;
flex-direction:column;
gap:10px;
}

.modelo-btn{
padding:14px;
background:#1f2937;
border:none;
border-radius:10px;
color:white;
cursor:pointer;
font-weight:600;
transition:.2s;
text-align:left;
}

.modelo-btn:hover{
background:#2563eb;
}

.viewer-card{
display:flex;
flex-direction:column;
}

model-viewer{
width:100%;
height:650px;
background:#0f172a;
border-radius:12px;
}

.info-item{
padding:10px 0;
border-bottom:1px solid #1f2937;
}

.label{
color:#94a3b8;
font-size:13px;
margin-bottom:4px;
}

.valor{
font-size:16px;
font-weight:600;
}

.inspecionar{
width:100%;
padding:16px;
margin-top:20px;
background:#16a34a;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
font-size:16px;
font-weight:bold;
transition:.2s;
}

.inspecionar:hover{
background:#15803d;
}

.status{
margin-top:15px;
padding:12px;
background:#1f2937;
border-radius:10px;
color:#94a3b8;
font-size:14px;
}

@media(max-width:1200px){

.layout{
grid-template-columns:1fr;
}

model-viewer{
height:500px;
}

}

@media(max-width:768px){

.header{
flex-direction:column;
gap:15px;
}

model-viewer{
height:400px;
}

}

</style>

</head>

<body>

<div class="header">

<div class="logo">

InspectAR

</div>

<a href="/" class="btn">

← Dashboard

</a>

</div>

<div class="container">

<div class="layout">

<!-- MODELOS -->

<div class="card">

<h2>Modelos Disponíveis</h2>

<div
id="listaModelos"
class="lista-modelos">

</div>

</div>

<!-- VISUALIZADOR -->

<div class="card viewer-card">

<h2 id="titulo">

Selecione um Modelo

</h2>

<model-viewer
id="viewer"
camera-controls
auto-rotate
shadow-intensity="1"
exposure="1.2">

</model-viewer>

<div
id="status"
class="status">

Selecione um modelo para iniciar.

</div>

</div>

<!-- INFORMAÇÕES -->

<div class="card">

<h2>Informações</h2>

<div class="info-item">

<div class="label">
PN
</div>

<div
id="pn"
class="valor">

-

</div>

</div>

<div class="info-item">

<div class="label">
Descrição
</div>

<div
id="descricao"
class="valor">

-

</div>

</div>

<button
class="inspecionar"
onclick="iniciarInspecao()">

🔍 Iniciar Inspeção

</button>

</div>

</div>

</div>

<script>

let modeloAtual = null;

const modelos =
JSON.parse(
localStorage.getItem("modelos")
|| "[]"
);

const lista =
document.getElementById(
"listaModelos"
);

if(modelos.length === 0){

lista.innerHTML =
`
<div class="status">
Nenhum modelo cadastrado.
</div>
`;

}

modelos.forEach(function(modelo){

const btn =
document.createElement("button");

btn.className =
"modelo-btn";

btn.innerHTML =
modelo.pn;

btn.onclick = function(){

modeloAtual = modelo;

document.getElementById(
"viewer"
).src =
"/modelos/" + modelo.arquivo;

document.getElementById(
"titulo"
).innerHTML =
modelo.pn;

document.getElementById(
"pn"
).innerHTML =
modelo.pn;

document.getElementById(
"descricao"
).innerHTML =
modelo.descricao;

document.getElementById(
"status"
).innerHTML =
"✅ Modelo carregado com sucesso.";

};

lista.appendChild(btn);

});

function iniciarInspecao(){

if(!modeloAtual){

alert(
"Selecione uma peça primeiro."
);

return;

}

window.location.href =
"/ar-viewer.html?pn=" +
encodeURIComponent(
modeloAtual.pn
)
+
"&arquivo=" +
encodeURIComponent(
modeloAtual.arquivo
);

}

</script>

</body>

</html>
