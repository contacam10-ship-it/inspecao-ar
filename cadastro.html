<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>InspectAR - Cadastros</title>

<script type="module"
src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
</script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:#0b1220;
color:white;
min-height:100vh;
}

.header{
background:#111827;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #1f2937;
}

.logo{
font-size:24px;
font-weight:700;
}

.btn-home{
background:#2563eb;
width:48px;
height:48px;
display:flex;
align-items:center;
justify-content:center;
border-radius:12px;
text-decoration:none;
color:white;
font-size:22px;
}

.container{
max-width:1400px;
margin:auto;
padding:20px;
}

.layout{

display:grid;
grid-template-columns:280px 1fr;

gap:20px;

}

.card{

background:#111827;

border:1px solid #1f2937;

border-radius:16px;

padding:20px;

}

.card h2{
margin-bottom:15px;
}

.lista-pns{
display:flex;
flex-direction:column;
gap:10px;
}

.pn-btn{

width:100%;
padding:14px;

background:#1f2937;

border:none;

border-radius:10px;

text-align:left;

color:white;

cursor:pointer;

font-weight:600;

}

.pn-btn:hover{
background:#2563eb;
}

.acoes{
display:flex;
gap:10px;
margin-bottom:20px;
flex-wrap:wrap;
}

.btn{

background:#2563eb;

color:white;

border:none;

padding:12px 16px;

border-radius:10px;

cursor:pointer;

}

.btn-danger{
background:#dc2626;
}

.form{

display:none;

background:#1f2937;

padding:15px;

border-radius:12px;

margin-bottom:20px;

}

.form.active{
display:block;
}

label{
display:block;
margin-top:10px;
margin-bottom:6px;
}

input,
select,
textarea{

width:100%;
padding:12px;

border:none;

border-radius:10px;

}

textarea{
height:90px;
}

.salvar{

margin-top:15px;

background:#16a34a;

color:white;

border:none;

padding:12px;

border-radius:10px;

cursor:pointer;

width:100%;

font-weight:bold;

}

.detalhes{

display:grid;

grid-template-columns:1fr 320px;

gap:20px;

}

.dados{

background:#1f2937;

padding:15px;

border-radius:12px;

}

.info{

margin-bottom:12px;

}

.titulo-info{
font-size:12px;
color:#94a3b8;
}

.valor-info{
font-size:16px;
font-weight:600;
}

model-viewer{
width:100%;
height:300px;
background:#0f172a;
border-radius:12px;
}

.caracteristica{

background:#1f2937;

padding:12px;

border-radius:10px;

margin-bottom:10px;

}

@media(max-width:1000px){

.layout{
grid-template-columns:1fr;
}

.detalhes{
grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<div class="header">

<div class="logo">
InspectAR
</div>

<a href="/" class="btn-home">
🏠
</a>

</div>

<div class="container">

<div class="layout">

<!-- LISTA DE PNS -->

<div class="card">

<h2>PNs Cadastrados</h2>

<div class="acoes">

<button
class="btn"
onclick="abrirNovoModelo()">

+ Modelo

</button>

<button
class="btn"
onclick="abrirNovaCaracteristica()">

+ Característica

</button>

</div>

<div
id="listaPns"
class="lista-pns">

</div>

</div>

<!-- DETALHES -->

<div>

<!-- FORM MODELO -->

<div
id="formModelo"
class="form">

<h2>Novo Modelo</h2>

<label>PN</label>
<input id="pn">

<label>Descrição</label>
<input id="descricao">

<label>Arquivo GLB</label>
<input id="arquivo">

<button
class="salvar"
onclick="salvarModelo()">

Salvar Modelo

</button>

</div>

<!-- FORM CARACTERÍSTICA -->

<div
id="formCaracteristica"
class="form">

<h2>Nova Característica</h2>

<label>PN</label>
<input id="pnCaracteristica">

<label>Característica</label>
<input id="caracteristica">

<label>Tipo</label>

<select id="tipo">

<option>FURO</option>
<option>COMPONENTE</option>
<option>DIMENSAO</option>

</select>

<label>Tolerância</label>
<input id="tolerancia">

<label>Critério</label>
<textarea id="criterio"></textarea>

<button
class="salvar"
onclick="salvarCaracteristica()">

Salvar Característica

</button>

</div>

<div class="card">

<h2>Detalhes</h2>

<div class="detalhes">

<div>

<div class="dados">

<div class="info">

<div class="titulo-info">
PN
</div>

<div
id="pnAtual"
class="valor-info">

Selecione um PN

</div>

</div>

<div class="info">

<div class="titulo-info">
Descrição
</div>

<div
id="descricaoAtual"
class="valor-info">

-

</div>

</div>

<button
class="btn-danger btn"
onclick="excluirModelo()">

🗑 Excluir Modelo

</button>

</div>

<br>

<h3>Características</h3>

<br>

<div
id="listaCaracteristicas">

Nenhuma característica.

</div>

</div>

<div>

<model-viewer
id="modeloViewer"
camera-controls
auto-rotate>

</model-viewer>

</div>

</div>

</div>

</div>

</div>

</div>

<script>

let modeloSelecionado = null;

function carregarModelos(){

const modelos =
JSON.parse(
localStorage.getItem("modelos")
|| "[]"
);

const area =
document.getElementById("listaPns");

area.innerHTML = "";

modelos.forEach(modelo=>{

const btn =
document.createElement("button");

btn.className =
"pn-btn";

btn.innerHTML =
modelo.pn;

btn.onclick = function(){

modeloSelecionado =
modelo;

document.getElementById(
"pnAtual"
).innerHTML =
modelo.pn;

document.getElementById(
"descricaoAtual"
).innerHTML =
modelo.descricao;

document.getElementById(
"modeloViewer"
).src =
"/modelos/" + modelo.arquivo;

carregarCaracteristicasPn(
modelo.pn
);

};

area.appendChild(btn);

});

}

function carregarCaracteristicasPn(pn){

const lista =
JSON.parse(
localStorage.getItem(
"caracteristicas"
) || "[]"
);

const area =
document.getElementById(
"listaCaracteristicas"
);

area.innerHTML = "";

lista
.filter(x=>x.pn===pn)
.forEach(item=>{

area.innerHTML += `

<div class="caracteristica">

<b>${item.caracteristica}</b>

<br>

${item.tipo}

</div>

`;

});

}

function abrirNovoModelo(){

document.getElementById(
"formModelo"
).classList.add("active");

document.getElementById(
"formCaracteristica"
).classList.remove("active");

}

function abrirNovaCaracteristica(){

document.getElementById(
"formCaracteristica"
).classList.add("active");

document.getElementById(
"formModelo"
).classList.remove("active");

}

function salvarModelo(){

const modelos =
JSON.parse(
localStorage.getItem("modelos")
|| "[]"
);

modelos.push({

pn:
document.getElementById("pn").value,

descricao:
document.getElementById("descricao").value,

arquivo:
document.getElementById("arquivo").value

});

localStorage.setItem(
"modelos",
JSON.stringify(modelos)
);

carregarModelos();

}

function salvarCaracteristica(){

const lista =
JSON.parse(
localStorage.getItem("caracteristicas")
|| "[]"
);

lista.push({

pn:
document.getElementById("pnCaracteristica").value,

caracteristica:
document.getElementById("caracteristica").value,

tipo:
document.getElementById("tipo").value,

tolerancia:
document.getElementById("tolerancia").value,

criterio:
document.getElementById("criterio").value

});

localStorage.setItem(
"caracteristicas",
JSON.stringify(lista)
);

}

function excluirModelo(){

if(!modeloSelecionado){
return;
}

const modelos =
JSON.parse(
localStorage.getItem("modelos")
|| "[]"
);

const novos =
modelos.filter(
m => m.pn !== modeloSelecionado.pn
);

localStorage.setItem(
"modelos",
JSON.stringify(novos)
);

location.reload();

}

carregarModelos();

</script>

</body>

</html>
