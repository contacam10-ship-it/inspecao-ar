<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>InspectAR - Cadastro de Modelos</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
color:white;
min-height:100vh;
}

.header{
background:#111827;
padding:20px;
}

.btn{
background:#2563eb;
color:white;
text-decoration:none;
padding:12px 18px;
border-radius:8px;
font-weight:bold;
}

.container{
max-width:1200px;
margin:auto;
padding:20px;
}

.card{
background:#1f2937;
padding:20px;
border-radius:12px;
margin-bottom:20px;
}

label{
display:block;
margin-top:15px;
margin-bottom:5px;
}

input{
width:100%;
padding:12px;
border:none;
border-radius:8px;
}

.salvar{
margin-top:20px;
background:#16a34a;
color:white;
border:none;
padding:12px 20px;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

.modelo{
background:#374151;
padding:15px;
border-radius:8px;
margin-bottom:10px;
}

.excluir{
margin-top:10px;
background:#dc2626;
color:white;
border:none;
padding:10px 15px;
border-radius:8px;
cursor:pointer;
}

.info{
margin-bottom:15px;
color:#cbd5e1;
font-weight:bold;
}

</style>

</head>

<body>

<div class="header">

<a href="/" class="btn">
← Dashboard
</a>

</div>

<div class="container">

<div class="card">

<h2>Novo Modelo</h2>

<label>PN</label>
<input
id="pn"
placeholder="86699800">

<label>Descrição</label>
<input
id="descricao"
placeholder="Pino de Fixação">

<label>Arquivo GLB</label>
<input
id="arquivo"
placeholder="86699800_prt.glb">

<button
class="salvar"
onclick="salvarModelo()">

Salvar Modelo

</button>

</div>

<div class="card">

<h2>Modelos Cadastrados</h2>

<div
id="total"
class="info">
</div>

<div id="lista">
</div>

</div>

</div>

<script>

function carregarModelos(){

const modelos =
JSON.parse(
localStorage.getItem("modelos")
|| "[]"
);

document.getElementById("total")
.innerHTML =
"Total de modelos: " + modelos.length;

const lista =
document.getElementById("lista");

lista.innerHTML = "";

modelos.forEach(function(modelo,index){

lista.innerHTML += `

<div class="modelo">

<b>PN:</b> ${modelo.pn}

<br><br>

<b>Descrição:</b>
${modelo.descricao}

<br><br>

<b>Arquivo:</b>
${modelo.arquivo}

<br>

<button
class="excluir"
onclick="excluirModelo(${index})">

🗑 Excluir

</button>

</div>

`;

});

}

function salvarModelo(){

const pn =
document.getElementById("pn")
.value.trim();

const descricao =
document.getElementById("descricao")
.value.trim();

const arquivo =
document.getElementById("arquivo")
.value.trim();

if(!pn || !arquivo){

alert(
"Preencha PN e Arquivo GLB."
);

return;

}

const modelos =
JSON.parse(
localStorage.getItem("modelos")
|| "[]"
);

const existe =
modelos.find(
m => m.pn === pn
);

if(existe){

alert(
"Já existe um modelo com esse PN."
);

return;

}

modelos.push({

pn: pn,
descricao: descricao,
arquivo: arquivo

});

localStorage.setItem(
"modelos",
JSON.stringify(modelos)
);

document.getElementById("pn").value = "";
document.getElementById("descricao").value = "";
document.getElementById("arquivo").value = "";

carregarModelos();

alert(
"Modelo cadastrado com sucesso."
);

}

function excluirModelo(index){

if(!confirm(
"Deseja excluir este modelo?"
)){
return;
}

const modelos =
JSON.parse(
localStorage.getItem("modelos")
|| "[]"
);

modelos.splice(index,1);

localStorage.setItem(
"modelos",
JSON.stringify(modelos)
);

carregarModelos();

}

carregarModelos();

</script>

</body>

</html>
